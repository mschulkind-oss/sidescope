# Non-secret preferences. Copy to ~/.config/sidescope/config.toml.
# Provider selection affects AI cards only; local/weather cards remain visible.
# Omit enabled for automatic visibility of reported providers.
# Agents come from ai-usagebar's report, in its order and under its names; this
# list only narrows them. Any reported id is valid, and one the report omits stays
# visible as unavailable.
# enabled = ["openrouter", "deepseek", "openai", "anthropic", "antigravity", "muse"]
show_agy_gpt_oss = false
# Optional closed theme id; omitted uses Original, including compact CPU cores.
# Each theme still curates a CPU/weather/telemetry layout for Comfortable density.
# Runtime theme/density browsing is session-only and never rewrites this file.
# theme = "paper"
# Optional independent density. Omitted means "screen-fit" (height-optimized pack).
# Click the separate footer density button or press D to toggle at runtime.
# "comfortable" restores each theme's curated CPU/weather/telemetry layout.
# Genuine overflow still scrolls in either density.
# density = "screen-fit" # or "comfortable"

# Read-only hardware sensors; no setup or privileges needed if hwmon is exposed.
# Omit this table for labeled CPU package/GPU edge temperatures and labeled fans.
# Explicit channels REPLACE defaults; [] intentionally selects no channels.
# device is the canonical chip device path (readlink -f on hwmonN/device, or
# the canonical hwmon directory's parent before /hwmon/hwmonN). Never use hwmonN.
# All temperatures are Celsius, inputs are millidegrees; fans are RPM.
# Labels are your descriptions, never inferred from a nonzero fan reading.
# [sensors]
# channels = [
#   { chip = "coretemp", device = "/sys/devices/platform/coretemp.0", channel = "temp1", label = "CPU package" },
#   { chip = "example-chip", device = "/sys/devices/platform/example", channel = "fan1", label = "Chosen fan" },
# ]

# No location requests until this entire table is explicitly configured.
# Replace these example coordinates and label with your chosen place.
# Coordinates are sent to Open-Meteo; the label stays local. No IP/GPS lookup.
# The free API is for non-commercial use only.
# [weather]
# latitude = 0.0
# longitude = 0.0
# place = "Your chosen place"
# units = "celsius" # or "fahrenheit"; omitted defaults to celsius

# Charts drawn from the JSON a local command prints. Nothing runs and no chart
# card exists until a source is configured here. A source's command runs with
# this application's authority and is NOT sandboxed: read it before enabling it.
# `sidescope doctor` prints every full command. Copy-ready synthetic examples
# and an opt-in usage-cost profile are in examples/charts/.
# Verify a candidate without a display: `sidescope charts check --config FILE`.
# {from}, {to} (RFC 3339 instants) and {timezone} must each be a whole argument.
# [[chart_sources]]
# id = "example-metrics"
# command = ["example-chart-data", "--from", "{from}", "--to", "{to}", "--timezone", "{timezone}"]
# format = "sidescope-chart-v1"  # or "columns-v1" plus a [chart_sources.mapping] table
# window = "3h"                  # whole minutes up to 30d; or calendar_days = 5 (1-400)
# timezone = "UTC"               # IANA zone; defines calendar days and axis labels
# refresh_seconds = 30           # 5 or more
# timeout_seconds = 10           # 1-60
# capture_stderr = false         # keep a sanitized 8 KiB excerpt in Info
#
# [[chart_cards]]
# id = "example-spend"
# source = "example-metrics"
# kind = "time-series"           # or "time-bars" or "ranked-bars"
# metric = "amount"
# group_by = ["project"]
# # optional: title, summary, top_n = 1-16, stack_by = "dimension", bounded_percent
