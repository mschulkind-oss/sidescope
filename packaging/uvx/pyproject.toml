[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescope"
version = "0.1.0"
description = "Sidescope Wayland status column launcher and runtime doctor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["wayland", "gtk4", "dashboard", "status", "sway"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mschulkind-oss/sidescope"
Repository = "https://github.com/mschulkind-oss/sidescope"

[project.scripts]
sidescope = "sidescope_uvx:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescope_uvx = ["bin/*"]
