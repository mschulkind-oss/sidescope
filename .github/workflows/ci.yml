name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Rust and native quality gate
        run: nix develop --command just check-ci
      - name: Real headless Wayland visual smoke test
        run: nix develop --command just test-visual
