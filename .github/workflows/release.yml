name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    if: github.repository_owner == 'mschulkind-oss' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(awk -F '"' '/^\[package\]/{package=1; next} /^\[/{package=0} package && /^version = /{print $2; exit}' Cargo.toml)
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
      - uses: cachix/install-nix-action@v31
      - name: Run quality gate in Nix shell
        run: nix develop --command just check-ci
      - name: Install Ubuntu development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build portable-to-Ubuntu binary
        run: CARGO_TARGET_DIR=target/host cargo +1.98.1 build --locked --release
      - name: Package tarball, uvx wheel, and Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          bin=target/host/release/sidescope
          ldd "$bin" | tee dependencies.txt
          ! grep -Eq 'not found|/nix/store/' dependencies.txt
          name="sidescope-${GITHUB_REF_NAME}-ubuntu24.04-x86_64"
          mkdir -p "dist/$name"
          cp "$bin" README.md LICENSE "dist/$name/"
          cat > "dist/$name/INSTALL.txt" <<'TXT'
          Linux x86_64, built on Ubuntu 24.04. Requires a Wayland compositor,
          GTK4 and libadwaita runtime libraries (Ubuntu: libgtk-4-1 and
          libadwaita-1-0). Install ai-usagebar separately for live data;
          use --report with a local versioned JSON report for sample mode.
          This is an early prototype, not a supported cross-distribution package.
          TXT
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tarball_sha=$(sha256sum "dist/$name.tar.gz" | awk '{print $1}')

          # Stage binary into uvx wrapper and build a Linux x86_64 wheel.
          uvx_stage=$(mktemp -d)
          cp -r packaging/uvx/. "$uvx_stage/"
          mkdir -p "$uvx_stage/src/sidescope_uvx/bin"
          cp "$bin" "$uvx_stage/src/sidescope_uvx/bin/sidescope"
          python3 -m pip install --upgrade pip build
          python3 -m build --wheel --outdir dist "$uvx_stage"
          for whl in dist/sidescope-*-py3-none-any.whl; do
            mv "$whl" "${whl%-py3-none-any.whl}-py3-none-manylinux_2_39_x86_64.whl"
          done

          # Render Homebrew formula with the release version and tarball SHA256.
          bash packaging/homebrew/render.sh "${GITHUB_REF_NAME#v}" "$tarball_sha" dist/sidescope.rb
          (cd dist && sha256sum "$name.tar.gz" *.whl sidescope.rb > SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/sidescope.rb
            dist/SHA256SUMS
      - name: Publish uvx wheel to PyPI
        uses: astral-sh/setup-uv@v5
      - name: Upload wheel via PyPI Trusted Publishing
        run: uv publish --trusted-publishing always dist/*.whl
      - name: Authenticate with crates.io via OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo +1.98.1 publish --locked
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: mschulkind-oss/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew formula in tap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp dist/sidescope.rb homebrew-tap/Formula/sidescope.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sidescope.rb
          if git diff --cached --quiet; then
            echo "Formula/sidescope.rb unchanged"
            exit 0
          fi
          git commit -m "sidescope ${GITHUB_REF_NAME}"
          git push origin main
